[project]
name = "lfmap-workspace"
version = "0.0.0"
description = "LFMAP monorepo root (uv workspace, no code)."
requires-python = ">=3.12,<3.15"
dependencies = ["lfmap-core", "lfmap-echo", "lfmap-markitdown", "lfmap-knowledge", "lfmap-powershell"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17", "pre-commit>=4"]

[tool.uv]
package = false

[tool.uv.sources]
lfmap-core = { workspace = true }
lfmap-echo = { workspace = true }
lfmap-markitdown = { workspace = true }
lfmap-knowledge = { workspace = true }
lfmap-powershell = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "plugins/*"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["packages", "plugins"]
