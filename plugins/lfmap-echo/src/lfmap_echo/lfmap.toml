[plugin]
id = "echo"
name = "Echo"
version = "0.1.0"
description = "Repeat text back; the reference plugin for lfmap-core adapters."
license = "Apache-2.0"
authors = ["Hung Nguyen"]
min_core_version = "0.1.0"

[plugin.entrypoint]
module = "lfmap_echo.tool"
class = "EchoTool"

[[operations]]
name = "say"
input = "lfmap_echo.schemas:SayInput"
output = "lfmap_echo.schemas:SayOutput"
side_effects = "none"

[permissions]
fs_read = []
fs_write = []
network = false
exec = []
cloud_ai = false

[adapters]
cli = true
mcp = true
rest = false
events = false

[dependencies.licenses]
allowed = ["MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "ISC", "PSF-2.0"]
