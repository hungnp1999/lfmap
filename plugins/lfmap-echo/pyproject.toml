[project]
name = "lfmap-echo"
version = "0.1.0"
description = "Sample LFMAP plugin: repeats text. Used to test lfmap-core adapters."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = ["lfmap-core"]

[project.entry-points."lfmap.plugins"]
echo = "lfmap_echo.tool:EchoTool"

[tool.uv.sources]
lfmap-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
