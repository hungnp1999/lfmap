[project]
name = "lfmap-llm"
version = "0.1.0"
description = "LFMAP plugin: summarise, extract and classify text through the model router."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = ["lfmap-core"]

[project.entry-points."lfmap.plugins"]
llm = "lfmap_llm.tool:LlmTool"

[tool.uv.sources]
lfmap-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
