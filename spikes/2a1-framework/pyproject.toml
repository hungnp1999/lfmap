[project]
name = "lfmap-spike-2a1-framework"
version = "0.0.0"
description = "Phase 2a.1 agent framework spike (internal, not distributed, not a workspace member)."
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic==2.14.1"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1"]
pydanticai = ["pydantic-ai-slim[openai]==2.60.0"]
langgraph = ["langgraph==1.2.16", "langchain-ollama==1.1.0", "langgraph-checkpoint-sqlite==3.1.2"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
